name: Multiplatform Release (reusable)

on:
  workflow_call:
    inputs:
      node_version:
        description: 'Node.js version to use'
        type: string
        default: '22'
      package_manager:
        description: 'Package manager (npm/yarn/pnpm) — must support "<pm> ci"'
        type: string
        default: 'npm'
      build_command:
        description: 'Command that typecheck/compiles the app before packaging'
        type: string
        default: 'npm run build'
      artifact_globs:
        description: 'Newline-separated glob patterns of packaged installers'
        type: string
        default: |
          dist/*.dmg
          dist/*.exe
          dist/*.AppImage
          dist/*.deb
          dist/*.snap
      upload_to_release_tag:
        description: 'Existing release tag to backfill assets onto (workflow_dispatch only)'
        type: string
        default: ''
    secrets:
      GH_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
          cache: ${{ inputs.package_manager }}

      - name: Install dependencies
        run: ${{ inputs.package_manager }} ci

      - name: Typecheck and build
        run: ${{ inputs.build_command }}

      # Tag pushes (v*) publish installers directly to a GitHub Release matching the tag.
      - name: Package and publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      # Manual runs (workflow_dispatch) only package and upload as workflow artifacts,
      # so the build can be verified without touching any GitHub Release.
      - name: Package (artifacts only)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --publish never

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.os }}
          path: ${{ inputs.artifact_globs }}
          if-no-files-found: ignore

      # Optional: attach this run's installers to an already-existing release (identified by
      # tag) without cutting a new version. Runs entirely on GitHub's infra, so it's the way
      # to backfill assets onto a release when the operator's local connection is too slow/
      # unreliable to round-trip large build artifacts through their own machine.
      - name: Upload to existing release
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.upload_to_release_tag != '' }}
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          while IFS= read -r pattern; do
            [ -z "$pattern" ] && continue
            for f in $pattern; do
              files+=("$f")
            done
          done <<< "${{ inputs.artifact_globs }}"
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release-worthy build outputs found for this platform, skipping upload."
            exit 0
          fi
          gh release upload "${{ inputs.upload_to_release_tag }}" "${files[@]}" --clobber --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
